name: opengym

services:
  media:
    image: alpine/git
    volumes:
      - ./media/img:/out/img
      - ./media/gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          echo "Downloading exercise media (~140 MB, one time)..."
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
          echo "Done."
        else
          echo "Media already present."
        fi
    restart: "no"
    exclude_from_hc: true

  api:
    image: registry.gitlab.com/duartesantos8/opengym/api:latest
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=${PORT:-3000}
      - DATA_DIR=/data
    volumes:
      - ./data:/data

  web:
    image: registry.gitlab.com/duartesantos8/opengym/web:latest
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      - media
      - api
    environment:
      - NGINX_PORT=80
      - BACKEND=${BACKEND:-api}
      - PORT=${PORT:-3000}
      - SERVICE_FQDN_WEB=${SERVICE_FQDN_WEB}
    volumes:
      - ./media/img:/usr/share/nginx/html/img:ro
      - ./media/gif:/usr/share/nginx/html/gif:ro
    labels:
      - traefik.enable=true
      - "traefik.http.routers.opengym.rule=Host(\`${SERVICE_FQDN_WEB}\`)"
      - traefik.http.routers.opengym.entrypoints=http
      - traefik.http.services.opengym.loadbalancer.server.port=80
